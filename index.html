<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP8266 LED Control</title>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getDatabase,
            ref,
            set,
            onValue
        } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        import {
            getAuth,
            signInAnonymously
        } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        // ==============================
        // FIREBASE CONFIGURATION
        // ==============================

        const firebaseConfig = {
            apiKey: "AIzaSyAtyjfD2ipkqdntOKOKpqRILv6tTqs2ri0",
            authDomain: "esp8266-led-788a3.firebaseapp.com",
            databaseURL: "https://esp8266-led-788a3-default-rtdb.firebaseio.com",
            projectId: "esp8266-led-788a3",
            storageBucket: "esp8266-led-788a3.firebasestorage.app",
            messagingSenderId: "731884341469",
            appId: "1:731884341469:web:b9f53e5e3b645beff0a8b334"
        };


        // ==============================
        // INITIALIZE FIREBASE
        // ==============================

        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);

        const auth = getAuth(app);

        const ledRef = ref(database, "led");


        // ==============================
        // ANONYMOUS LOGIN
        // ==============================

        signInAnonymously(auth)
            .then(() => {

                console.log("Firebase authentication successful");

                // Read LED status from Firebase
                onValue(ledRef, (snapshot) => {

                    const ledState = snapshot.val();

                    if (ledState === true) {

                        document.getElementById("status").innerHTML = "LED: ON";
                        document.getElementById("status").className = "on";

                    } else {

                        document.getElementById("status").innerHTML = "LED: OFF";
                        document.getElementById("status").className = "off";

                    }

                });

            })
            .catch((error) => {

                console.error("Authentication error:", error);

                document.getElementById("status").innerHTML =
                    "Firebase connection error";

            });


        // ==============================
        // LED ON
        // ==============================

        window.ledON = function () {

            set(ledRef, true)
                .then(() => {

                    console.log("LED ON");

                })
                .catch((error) => {

                    console.error("Error:", error);

                });

        };


        // ==============================
        // LED OFF
        // ==============================

        window.ledOFF = function () {

            set(ledRef, false)
                .then(() => {

                    console.log("LED OFF");

                })
                .catch((error) => {

                    console.error("Error:", error);

                });

        };

    </script>


    <!-- ==============================
       WEBSITE DESIGN
       ============================== -->

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        .container {
            background: white;

            width: 350px;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }


        h1 {
            margin-bottom: 30px;
        }


        #status {
            font-size: 24px;

            font-weight: bold;

            margin: 25px 0;
        }


        .on {
            color: green;
        }


        .off {
            color: red;
        }


        button {
            width: 120px;

            padding: 15px;

            margin: 8px;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;
        }


        .onButton {
            background: green;

            color: white;
        }


        .offButton {
            background: red;

            color: white;
        }


        button:hover {
            opacity: 0.8;
        }
    </style>

</head>


<body>

    <div class="container">

        <h1>ESP8266 LED Control</h1>

        <div id="status" class="off">
            LED: OFF
        </div>

        <button class="onButton" onclick="ledON()">
            ON
        </button>

        <button class="offButton" onclick="ledOFF()">
            OFF
        </button>

    </div>

</body>

</html>
